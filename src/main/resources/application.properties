spring.application.name=storage-app
spring.datasource.url=jdbc:postgresql://localhost:5433/db_storage
spring.datasource.username=postgres
spring.datasource.password=postgres

server.port=8090
spring.servlet.multipart.max-file-size=262144000
spring.servlet.multipart.max-request-size=524288000

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

minio.endpoint=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucketName=user-files

spring.session.data.redis.flush-mode=on_save
spring.session.data.redis.namespace=cloudStorage:session

spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=CLOUD_STORAGE_SESSION_ID

spring.jpa.hibernate.ddl-auto=none
spring.mvc.async.request-timeout=-1

logging.level.org.springframework.security=warn
logging.level.org.springframework.security.web=warn
logging.level.org.springframework.security.web.context=warn


