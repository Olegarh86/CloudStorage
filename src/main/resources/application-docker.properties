spring.application.name=storage-app
spring.datasource.url=${JAVA_DB_URL:jdbc:postgresql://db_storage:5432/db_storage}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

server.port=${SERVER_PORT:8090}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:2500MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5000MB}
server.tomcat.max-part-count=1000
server.tomcat.max-swallow-size=-1

spring.data.redis.host=${REDIS_HOST:redis_storage}
spring.data.redis.port=${REDIS_PORT:6379}

minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.accessKey=${MINIO_ROOT_USER:minioadmin}
minio.secretKey=${MINIO_ROOT_PASSWORD:minioadmin}
minio.bucketName=${MINIO_BUCKET_NAME:user-files}

spring.session.data.redis.flush-mode=${REDIS_FLUSH_MODE:on_save}
spring.session.data.redis.namespace=${REDIS_NAMESPACE:cloudStorage:session}

spring.jpa.open-in-view=false
#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=CLOUD_STORAGE_SESSION_ID

spring.jpa.hibernate.ddl-auto=none
spring.mvc.async.request-timeout=-1
