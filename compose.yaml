name: "cloud-storage-dev"

services:
  db_storage:
    image: 'olegarholeg/postgres:16-alpine'
    restart: "always"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=db_storage
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_storage"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis_storage:
    image: 'olegarholeg/redis:7-alpine'
    restart: "always"
    ports:
      - '6379:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    image: "olegarholeg/minio:latest"
    restart: always
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data_dev:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_ENDPOINT=http://localhost:9010
      - MINIO_BUCKET_NAME=user-files
    command: server /data --address ":9000" --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 3s
      timeout: 3s
      retries: 5
volumes:
  pgdata_dev:
  minio_data_dev: